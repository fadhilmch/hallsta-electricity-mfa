[project]
name = "hallsta-mfa"
version = "0.1.0"
description = "Electricity energy and exergy flow analysis (MFA) of Holmen Hallsta paper mill, 2023, with Monte Carlo uncertainty"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "scipy",
    "plotly",
    "CoolProp",
    "jinja2",
    "kaleido>=1.4.0",
]

[dependency-groups]
dev = ["jupyterlab", "nbconvert", "nbformat", "ipykernel", "pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hallsta_mfa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
